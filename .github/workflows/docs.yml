name: docs

on:
  pull_request:
  push:
    branches: [master]

jobs:
  internal-links:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/scripts/check_links.py
      - run: python3 .github/scripts/check_json_blocks.py
      - run: python3 .github/scripts/build_llms.py --check
