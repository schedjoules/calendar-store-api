name: Experiment QA Agent

# Triggers when someone comments on an issue
on:
  issue_comment:
    types: [created]

jobs:
  answer-question:
    # Only run if the comment contains a question mark
    if: contains(github.event.comment.body, '?')
    runs-on: ubuntu-latest

    steps:
      - name: Check if experiment-related issue
        id: check-experiment
        uses: actions/github-script@v7
        with:
          script: |
            const issueNumber = context.payload.issue.number;
            const issueBody = context.payload.issue.body || '';
            const commentBody = context.payload.comment.body || '';
            const commentAuthor = context.payload.comment.user.login;

            // Don't respond to our own comments
            if (commentAuthor === 'github-actions[bot]') {
              core.setOutput('should_answer', 'false');
              return;
            }

            // Check if this issue is part of an experiment
            // Pattern 1: "Parent experiment: #N" (schedjoules-app issues)
            // Pattern 2: "**Experiment:** [name (#N)](url)" (cross-repo issues)
            const parentMatch = issueBody.match(/Parent experiment:\s*#(\d+)/);
            const crossRepoMatch = issueBody.match(/\*\*Experiment:\*\*.*?#(\d+)/);
            const isExperimentSpec = issueBody.includes('Experiment Scope') || issueBody.includes('Hypothesis');

            if (!parentMatch && !crossRepoMatch && !isExperimentSpec) {
              console.log('Issue is not part of an experiment. Skipping.');
              core.setOutput('should_answer', 'false');
              return;
            }

            const experimentNumber = parentMatch ? parseInt(parentMatch[1])
              : crossRepoMatch ? parseInt(crossRepoMatch[1])
              : issueNumber;

            // Experiment specs and sibling issues always live in schedjoules-app
            const experimentRepo = 'schedjoules-app';
            const experimentOwner = 'schedjoules';

            // Gather context: read experiment spec from schedjoules-app
            let experimentBody = '';
            const isLocalExperimentSpec = isExperimentSpec && context.repo.repo === experimentRepo;
            if (isLocalExperimentSpec) {
              experimentBody = issueBody;
            } else {
              try {
                const expIssue = await github.rest.issues.get({
                  owner: experimentOwner,
                  repo: experimentRepo,
                  issue_number: experimentNumber
                });
                experimentBody = expIssue.data.body || '';
              } catch (e) {
                console.log(`Could not read experiment #${experimentNumber} from ${experimentRepo}: ${e.message}`);
              }
            }

            // Find sibling issues in schedjoules-app that reference this experiment
            const siblingIssues = [];
            try {
              const issues = await github.rest.issues.listForRepo({
                owner: experimentOwner,
                repo: experimentRepo,
                state: 'all',
                per_page: 50
              });

              for (const issue of issues.data) {
                const body = issue.body || '';
                if (body.includes(`Parent experiment: #${experimentNumber}`) && issue.number !== experimentNumber) {
                  siblingIssues.push({
                    number: issue.number,
                    title: issue.title,
                    body: body.substring(0, 3000)
                  });
                }
              }
            } catch (e) {
              console.log(`Could not list sibling issues: ${e.message}`);
            }

            // Also find sibling issues in the current repo (if different from schedjoules-app)
            if (context.repo.repo !== experimentRepo) {
              try {
                const localIssues = await github.rest.issues.listForRepo({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'all',
                  per_page: 50
                });

                for (const issue of localIssues.data) {
                  const body = issue.body || '';
                  if ((body.includes(`#${experimentNumber}`) || body.match(/\*\*Experiment:\*\*.*?#\d+/)) && issue.number !== issueNumber) {
                    siblingIssues.push({
                      number: issue.number,
                      title: `[${context.repo.repo}] ${issue.title}`,
                      body: body.substring(0, 3000)
                    });
                  }
                }
              } catch (e) {
                console.log(`Could not list local sibling issues: ${e.message}`);
              }
            }

            // Read recent comments on the current issue for thread context
            let recentComments = [];
            try {
              const comments = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                per_page: 10
              });
              recentComments = comments.data
                .filter(c => c.user.login !== 'github-actions[bot]')
                .slice(-5)
                .map(c => ({
                  author: c.user.login,
                  body: c.body.substring(0, 1000)
                }));
            } catch (e) {
              console.log(`Could not read comments: ${e.message}`);
            }

            core.setOutput('should_answer', 'true');
            core.setOutput('experiment_number', experimentNumber.toString());
            core.setOutput('experiment_body', experimentBody.substring(0, 5000));
            core.setOutput('issue_number', issueNumber.toString());
            core.setOutput('issue_title', context.payload.issue.title);
            core.setOutput('issue_body', issueBody.substring(0, 5000));
            core.setOutput('question', commentBody);
            core.setOutput('question_author', commentAuthor);
            core.setOutput('sibling_issues', JSON.stringify(siblingIssues));
            core.setOutput('recent_comments', JSON.stringify(recentComments));

      - name: Read documentation context
        if: steps.check-experiment.outputs.should_answer == 'true'
        id: read-docs
        uses: actions/checkout@v4
        with:
          repository: schedjoules/schedjoules-app
          sparse-checkout: docs/
          sparse-checkout-cone-mode: true

      - name: Load documentation
        if: steps.check-experiment.outputs.should_answer == 'true'
        id: docs
        run: |
          # Read key documentation files for context
          DOCS_CONTEXT=""

          if [ -f "docs/WAY_OF_WORKING_GITHUB.md" ]; then
            DOCS_CONTEXT="$DOCS_CONTEXT\n\n## Way of Working\n$(head -100 docs/WAY_OF_WORKING_GITHUB.md)"
          fi

          if [ -f "docs/BEHAVIOR_ENGINE_OVERVIEW.md" ]; then
            DOCS_CONTEXT="$DOCS_CONTEXT\n\n## Behavior Engine Overview\n$(head -80 docs/BEHAVIOR_ENGINE_OVERVIEW.md)"
          fi

          # Write to file to avoid shell escaping issues
          echo -e "$DOCS_CONTEXT" > /tmp/docs_context.txt

      - name: Answer via Claude API
        if: steps.check-experiment.outputs.should_answer == 'true'
        id: answer
        uses: actions/github-script@v7
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        with:
          script: |
            const fs = require('fs');

            const experimentNumber = '${{ steps.check-experiment.outputs.experiment_number }}';
            const issueNumber = '${{ steps.check-experiment.outputs.issue_number }}';
            const issueTitle = '${{ steps.check-experiment.outputs.issue_title }}';
            const question = `${{ steps.check-experiment.outputs.question }}`;
            const questionAuthor = '${{ steps.check-experiment.outputs.question_author }}';

            let issueBody, experimentBody, siblingIssues, recentComments;
            try {
              issueBody = `${{ steps.check-experiment.outputs.issue_body }}`;
              experimentBody = `${{ steps.check-experiment.outputs.experiment_body }}`;
              siblingIssues = JSON.parse('${{ steps.check-experiment.outputs.sibling_issues }}'.replace(/'/g, "\\'"));
              recentComments = JSON.parse('${{ steps.check-experiment.outputs.recent_comments }}'.replace(/'/g, "\\'"));
            } catch (e) {
              issueBody = '';
              experimentBody = '';
              siblingIssues = [];
              recentComments = [];
            }

            let docsContext = '';
            try {
              docsContext = fs.readFileSync('/tmp/docs_context.txt', 'utf8');
            } catch (e) {
              console.log('Could not read docs context');
            }

            const prompt = `You are the experiment QA agent. You answer questions posted on experiment-related GitHub issues.

## Personality

You have a dry, understated wit. Think: Ricky Gervais if he genuinely liked his coworkers. Warm underneath, bone-dry delivery.

How this shows up:
- Technical answers are clear and professional, but you allow yourself a dry observation here and there. Never at the expense of clarity.
- When someone asks something obviously not serious, you play along with deadpan humor. You recognize the joke and match its energy.
- When you lack context, admit it honestly but be wry about your own limitations. ("I'd love to help, but I can't see the backend repo. I'm basically answering this with one eye closed.")
- Never force humor. If the question is straightforward, answer it straight. The wit only shows up when there's a natural opening.

Hard boundaries: never mean, never sarcastic at someone's expense, never condescending. Never mock the question or the person. Dad jokes are acceptable only if you immediately acknowledge they're terrible. The goal is to make someone smile during a long day of coding, not to perform.

## Your rules

1. Answer the question directly. Lead with the answer, not background.
2. Be concise. Engineers want answers, not essays.
3. Reference specific issue numbers when describing how things connect.
4. If you cannot fully answer from the context provided, say so explicitly.
5. Never guess at implementation details you cannot verify.
6. Do not give unsolicited advice, suggestions, or scope commentary.
7. Cross-repo limitation: you can only see issues in the schedjoules-app repo. If the question is about backend code (event-discovery-backend, calendar-store-api), reference the issue spec that describes expected behavior, but state that you cannot see the actual backend code.
8. Format your answer for GitHub markdown.
9. If the question is clearly not serious or not related to the experiment, have fun with it. Match the energy. But keep it short.

## Context

### This issue: #${issueNumber} — ${issueTitle}

${issueBody}

### Parent experiment: #${experimentNumber}

${experimentBody}

### Related issues in this experiment

${siblingIssues.map(s => `#### #${s.number} — ${s.title}\n${s.body}`).join('\n\n')}

### Recent comments on this issue (for thread context)

${recentComments.map(c => `**${c.author}:** ${c.body}`).join('\n\n')}

### Documentation

${docsContext}

## Question

**${questionAuthor}** asks:

> ${question}

## Your answer

Answer the question based on the context above. End with: — experiment-qa-agent`;

            const response = await fetch('https://api.anthropic.com/v1/messages', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json',
                'x-api-key': process.env.ANTHROPIC_API_KEY,
                'anthropic-version': '2023-06-01'
              },
              body: JSON.stringify({
                model: 'claude-sonnet-4-20250514',
                max_tokens: 1500,
                messages: [{
                  role: 'user',
                  content: prompt
                }]
              })
            });

            if (!response.ok) {
              const error = await response.text();
              core.setFailed(`Anthropic API error: ${response.status} ${error}`);
              return;
            }

            const result = await response.json();
            const answer = result.content[0].text;

            core.setOutput('answer', answer);

      - name: Post answer
        if: steps.check-experiment.outputs.should_answer == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const answer = `${{ steps.answer.outputs.answer }}`;
            const issueNumber = parseInt('${{ steps.check-experiment.outputs.issue_number }}');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: answer
            });

            console.log(`Answer posted on issue #${issueNumber}`);
